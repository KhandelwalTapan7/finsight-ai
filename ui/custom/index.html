<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocSight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161f; --ink-soft:#1c1f2a; --ink-line:#2a2e3c;
    --paper:#f6f3ea; --paper-line:#e3ddc9; --paper-card:#fffdf7;
    --accent:#b5793a; --accent-soft:#e7c9a0;
    --ink-text:#eeece3; --muted:#8b8fa3; --paper-text:#22242c; --paper-muted:#6b6a5f;
    --err:#b0453f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; background:var(--paper); color:var(--paper-text);
    font-family:'Inter',system-ui,sans-serif; font-size:15px;
  }
  .rail{
    width:260px; flex:none; background:var(--ink); color:var(--ink-text);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  }
  .rail-head{ padding:22px 20px 16px; border-bottom:1px solid var(--ink-line); }
  .wordmark{
    font-family:'Source Serif 4',serif; font-size:22px; font-weight:600;
    letter-spacing:.2px; margin:0;
  }
  .wordmark span{color:var(--accent-soft)}
  .tagline{ margin:4px 0 0; font-size:12.5px; color:var(--muted); }
  .rail-section{ padding:16px 20px; border-bottom:1px solid var(--ink-line); }
  .rail-label{
    font-size:11.5px; color:var(--muted); margin:0 0 10px; font-weight:500;
  }
  .doclist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .doc-row{
    display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:6px;
    background:var(--ink-soft); font-size:13px; cursor:default;
  }
  .doc-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .doc-dot.pending,.doc-dot.processing{ background:var(--accent-soft); animation:pulse 1.1s ease-in-out infinite; }
  .doc-dot.ready{ background:#7fae7a; }
  .doc-dot.failed{ background:var(--err); }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .doc-meta{ font-size:11px; color:var(--muted); }
  .upload-zone{
    margin-top:12px; border:1px dashed var(--ink-line); border-radius:8px;
    padding:16px 10px; text-align:center; font-size:12.5px; color:var(--muted);
    cursor:pointer; transition:border-color .15s, color .15s;
  }
  .upload-zone:hover, .upload-zone.drag{ border-color:var(--accent-soft); color:var(--ink-text); }
  .upload-zone input{ display:none; }
  .rail-actions{ margin-top:auto; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
  .rail-btn{
    background:none; border:1px solid var(--ink-line); color:var(--ink-text);
    font:inherit; font-size:12.5px; padding:8px 10px; border-radius:6px; cursor:pointer;
    text-align:left; transition:border-color .15s;
  }
  .rail-btn:hover{ border-color:var(--accent-soft); }

  .main{ flex:1; display:flex; flex-direction:column; height:100vh; }
  .thread{
    flex:1; overflow-y:auto; padding:36px 0 20px;
    display:flex; flex-direction:column; align-items:center;
  }
  .thread-inner{ width:100%; max-width:680px; padding:0 22px; display:flex; flex-direction:column; gap:18px; }

  .empty{ margin:auto; text-align:center; max-width:420px; color:var(--paper-muted); }
  .empty h1{
    font-family:'Source Serif 4',serif; font-weight:600; font-size:26px;
    color:var(--paper-text); margin:0 0 8px;
  }
  .empty p{ font-size:14px; line-height:1.55; margin:0; }

  .msg{ display:flex; flex-direction:column; gap:6px; animation:rise .28s ease-out; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .msg.user{ align-items:flex-end; }
  .bubble{
    border-radius:10px; padding:12px 14px; font-size:14.5px; line-height:1.55;
    max-width:88%;
  }
  .msg.user .bubble{ background:var(--ink); color:var(--ink-text); border-bottom-right-radius:3px; }
  .msg.assistant .bubble{
    background:var(--paper-card); border:1px solid var(--paper-line);
    border-bottom-left-radius:3px;
  }
  .bubble p{ margin:0 0 8px; } .bubble p:last-child{ margin-bottom:0; }
  .file-chip{
    display:flex; align-items:center; gap:8px; background:var(--paper-card);
    border:1px solid var(--paper-line); border-radius:8px; padding:8px 10px;
    font-size:12.5px; color:var(--paper-muted); margin-top:6px;
  }
  .cite{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent);
    border:1px solid var(--accent-soft); border-radius:4px; padding:1px 5px;
    white-space:nowrap;
  }
  .steps{ margin-top:2px; display:flex; flex-direction:column; gap:4px; }
  .step{ border:1px solid var(--paper-line); border-radius:8px; background:var(--paper-card); }
  .step summary{
    list-style:none; cursor:pointer; padding:7px 10px; font-size:12px;
    color:var(--paper-muted); display:flex; align-items:center; gap:6px;
  }
  .step summary::-webkit-details-marker{ display:none; }
  .step summary::before{ content:'›'; font-family:'IBM Plex Mono',monospace; transition:transform .15s; }
  .step[open] summary::before{ transform:rotate(90deg); }
  .step-body{ padding:0 10px 10px; font-size:12.5px; }
  .step-body pre{
    background:var(--paper); border:1px solid var(--paper-line); border-radius:6px;
    padding:8px; overflow-x:auto; margin:4px 0; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  }
  .thinking{ display:flex; gap:4px; padding:12px 14px; }
  .thinking span{
    width:6px; height:6px; border-radius:50%; background:var(--paper-muted);
    animation:bounce 1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:.15s } .thinking span:nth-child(3){ animation-delay:.3s }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:.4} 30%{transform:translateY(-4px); opacity:1} }

  .error-line{
    border:1px solid var(--err); background:#fbeceb; color:#7c2d28;
    border-radius:8px; padding:10px 12px; font-size:13px;
  }

  .composer{
    border-top:1px solid var(--paper-line); padding:14px 22px 18px;
    display:flex; justify-content:center;
  }
  .composer-inner{ width:100%; max-width:680px; display:flex; flex-direction:column; gap:8px; }
  .settings-row{ display:flex; align-items:center; gap:14px; font-size:12px; color:var(--paper-muted); }
  .settings-row label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
  .input-row{ display:flex; gap:8px; align-items:flex-end; }
  textarea{
    flex:1; resize:none; border:1px solid var(--paper-line); border-radius:10px;
    padding:11px 12px; font:inherit; font-size:14px; background:var(--paper-card);
    color:var(--paper-text); max-height:140px; line-height:1.4;
  }
  textarea:focus{ outline:none; border-color:var(--accent); }
  .send-btn{
    background:var(--accent); color:#fff8f0; border:none; border-radius:9px;
    width:42px; height:42px; flex:none; cursor:pointer; display:flex;
    align-items:center; justify-content:center; transition:opacity .15s;
  }
  .send-btn:disabled{ opacity:.4; cursor:default; }

  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(20,22,31,.4); display:flex;
    align-items:center; justify-content:center; z-index:20;
  }
  .drawer{
    background:var(--paper-card); border-radius:12px; padding:20px 22px;
    width:340px; max-width:90vw; border:1px solid var(--paper-line);
  }
  .drawer h3{ margin:0 0 12px; font-family:'Source Serif 4',serif; font-size:18px; }
  .drawer dl{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
  .drawer dt{ color:var(--paper-muted); }
  .drawer dd{ margin:0; text-align:right; }
  .drawer-close{
    margin-top:16px; width:100%; padding:9px; border:1px solid var(--paper-line);
    background:none; border-radius:7px; font:inherit; cursor:pointer;
  }

  @media (max-width: 720px){
    .rail{ position:fixed; z-index:15; transform:translateX(-100%); transition:transform .2s; }
    .rail.open{ transform:none; }
    .rail-toggle{
      position:fixed; top:14px; left:14px; z-index:16; background:var(--ink);
      color:var(--ink-text); border:none; border-radius:7px; width:34px; height:34px; cursor:pointer;
    }
    .thread-inner, .composer-inner{ max-width:100%; }
  }
</style>
</head>
<body>

<button class="rail-toggle" id="railToggle" style="display:none">☰</button>

<aside class="rail" id="rail">
  <div class="rail-head">
    <p class="wordmark">Doc<span>Sight</span></p>
    <p class="tagline">Ask anything your files know</p>
  </div>

  <div class="rail-section" style="flex:1; overflow-y:auto;">
    <p class="rail-label">Documents</p>
    <ul class="doclist" id="docList"></ul>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="application/pdf" />
      Drop a PDF, or click to choose
    </div>
  </div>

  <div class="rail-actions">
    <button class="rail-btn" id="statsBtn">Session stats</button>
    <button class="rail-btn" id="clearBtn">Clear my documents</button>
  </div>
</aside>

<main class="main">
  <div class="thread" id="thread">
    <div class="thread-inner" id="threadInner">
      <div class="empty" id="emptyState">
        <h1>Nothing open yet</h1>
        <p>Drop a PDF in the sidebar — a contract, a resume, a report, a paper.
           Once it's indexed, ask it anything and get answers with page citations,
           not guesses.</p>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <div class="settings-row">
        <label><input type="checkbox" id="includeShared" checked /> Include shared corpus</label>
        <label>Sources per answer
          <input type="range" id="topK" min="2" max="8" value="4" style="vertical-align:middle" />
          <span id="topKVal">4</span>
        </label>
      </div>
      <div class="input-row">
        <textarea id="queryInput" placeholder="Ask about your documents…" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  const API = ""; // same-origin: this file is served by the FastAPI app itself
  const SKEY = "docsight_session_v1";

  function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&0x3|0x8)).toString(16);}); }

  let state = JSON.parse(sessionStorage.getItem(SKEY) || "null");
  if (!state) {
    state = { user_id: uuid(), session_id: uuid().slice(0,8), docs: [] };
    sessionStorage.setItem(SKEY, JSON.stringify(state));
  }
  function persist(){ sessionStorage.setItem(SKEY, JSON.stringify(state)); }

  const $ = sel => document.querySelector(sel);
  const docList = $("#docList"), threadInner = $("#threadInner"), emptyState = $("#emptyState");
  const thread = $("#thread"), queryInput = $("#queryInput"), sendBtn = $("#sendBtn");
  const uploadZone = $("#uploadZone"), fileInput = $("#fileInput");
  const topK = $("#topK"), topKVal = $("#topKVal"), includeShared = $("#includeShared");

  topK.addEventListener("input", () => topKVal.textContent = topK.value);

  // ---------- document rail ----------
  function renderDocs(){
    docList.innerHTML = "";
    state.docs.forEach(d => {
      const li = document.createElement("li");
      li.className = "doc-row";
      li.innerHTML = `<span class="doc-dot ${d.status}"></span>
        <span class="doc-name" title="${d.filename}">${d.filename}</span>
        <span class="doc-meta">${d.status === "ready" ? (d.chunk_count + " chunks") : d.status}</span>`;
      docList.appendChild(li);
    });
  }
  renderDocs();

  async function pollStatus(docId){
    for (let i=0;i<60;i++){
      await new Promise(r=>setTimeout(r,1000));
      try{
        const res = await fetch(`${API}/ingest/status/${docId}`);
        const data = await res.json();
        const doc = state.docs.find(d=>d.doc_id===docId);
        if (!doc) return;
        doc.status = data.status; doc.chunk_count = data.chunk_count; doc.error = data.error;
        persist(); renderDocs();
        if (data.status === "ready" || data.status === "failed") return;
      }catch(e){ return; }
    }
  }

  async function uploadFile(file){
    if (!file || file.type !== "application/pdf"){
      addError("Only PDF files are supported right now.");
      return;
    }
    const fd = new FormData(); fd.append("file", file);
    try{
      const res = await fetch(`${API}/upload?user_id=${state.user_id}&session_id=${state.session_id}`, { method:"POST", body: fd });
      if (!res.ok) throw new Error(`upload failed (${res.status})`);
      const data = await res.json();
      state.docs.push({ doc_id:data.doc_id, filename:file.name, status:data.status, chunk_count:0 });
      persist(); renderDocs();
      pollStatus(data.doc_id);
    }catch(e){
      addError(`Couldn't upload "${file.name}". Check that DocSight's server is awake — free instances sleep after 15 minutes idle, so the first request can take a moment.`);
    }
  }

  uploadZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => { if (e.target.files[0]) uploadFile(e.target.files[0]); fileInput.value = ""; });
  ["dragover","dragenter"].forEach(evt => uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.add("drag"); }));
  ["dragleave","drop"].forEach(evt => uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.remove("drag"); }));
  uploadZone.addEventListener("drop", e => { if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); });

  // ---------- chat thread ----------
  function citeify(text){
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const delatex = escaped
      .replace(/\\\[|\\\]/g, "")            // \[ \] block-math delimiters
      .replace(/\\\(|\\\)/g, "")             // \( \) inline-math delimiters
      .replace(/\\text\{([^}]*)\}/g, "$1")   // \text{K} -> K
      .replace(/\\times/g, "×")
      .replace(/\\cdot/g, "·")
      .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");
    const bolded = delatex.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return bolded.replace(/\[([\w-]{3,16}\s+p\.\d+(?:\s*·\s*[\w-]+)*)\]/g, '<span class="cite">$1</span>');
  }
  function paragraphs(text){
    return text.split(/\n{2,}/).map(p => `<p>${citeify(p).replace(/\n/g,"<br>")}</p>`).join("");
  }

  function addError(text){
    emptyState.remove();
    const div = document.createElement("div");
    div.className = "error-line";
    div.textContent = text;
    threadInner.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  function addUserMessage(text, fileName){
    if (emptyState.parentNode) emptyState.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg user";
    wrap.innerHTML = `<div class="bubble">${citeify(text)}</div>` +
      (fileName ? `<div class="file-chip">📄 ${fileName}</div>` : "");
    threadInner.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function addThinking(){
    const wrap = document.createElement("div");
    wrap.className = "msg assistant"; wrap.id = "thinkingMsg";
    wrap.innerHTML = `<div class="bubble thinking"><span></span><span></span><span></span></div>`;
    threadInner.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function addAssistantMessage(answer, steps){
    const t = document.getElementById("thinkingMsg");
    if (t) t.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    const stepsHtml = (steps || [])
      .filter(s => s.tool)
      .map(s => `
        <details class="step">
          <summary>Used ${s.tool}</summary>
          <div class="step-body">
            <div><strong>Query</strong></div>
            <pre>${(s.input && s.input.query) || JSON.stringify(s.input||{})}</pre>
            <div><strong>Result</strong></div>
            <pre>${citeify(s.output || "(no output)")}</pre>
          </div>
        </details>`).join("");
    wrap.innerHTML = `<div class="bubble">${paragraphs(answer)}</div>` +
      (stepsHtml ? `<div class="steps">${stepsHtml}</div>` : "");
    threadInner.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  async function sendQuery(){
    const q = queryInput.value.trim();
    if (!q) return;
    queryInput.value = ""; queryInput.style.height = "auto";
    addUserMessage(q);
    addThinking();
    sendBtn.disabled = true;
    try{
      const res = await fetch(`${API}/chat`, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          query:q, user_id:state.user_id, session_id:state.session_id,
          include_shared: includeShared.checked, top_k: Number(topK.value),
        }),
      });
      if (!res.ok) throw new Error(`chat failed (${res.status})`);
      const data = await res.json();
      addAssistantMessage(data.answer, data.steps);
    }catch(e){
      document.getElementById("thinkingMsg")?.remove();
      addError("Couldn't reach DocSight's server just now. If this is the first request in a while, the free instance may still be waking up — try again in about a minute.");
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendQuery);
  queryInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendQuery(); }
  });
  queryInput.addEventListener("input", () => {
    queryInput.style.height = "auto";
    queryInput.style.height = Math.min(queryInput.scrollHeight, 140) + "px";
  });

  // ---------- session stats / clear ----------
  function openDrawer(title, rows){
    const backdrop = document.createElement("div");
    backdrop.className = "drawer-backdrop";
    const dl = rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    backdrop.innerHTML = `<div class="drawer"><h3>${title}</h3><dl>${dl}</dl>
      <button class="drawer-close">Close</button></div>`;
    document.body.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });
    backdrop.querySelector(".drawer-close").addEventListener("click", close);
  }

  $("#statsBtn").addEventListener("click", async () => {
    try{
      const res = await fetch(`${API}/admin/session-stats/${state.user_id}/${state.session_id}`);
      const data = await res.json();
      const rows = Object.entries(data).map(([k,v]) => [k, typeof v === "object" ? JSON.stringify(v) : v]);
      openDrawer("Session stats", rows.length ? rows : [["status","no activity yet"]]);
    }catch(e){ addError("Couldn't fetch session stats right now."); }
  });

  $("#clearBtn").addEventListener("click", async () => {
    if (!confirm("Delete every document you've uploaded this session? This can't be undone.")) return;
    try{
      await fetch(`${API}/admin/cleanup/${state.user_id}/${state.session_id}`, { method:"POST" });
      state.docs = []; persist(); renderDocs();
      threadInner.innerHTML = "";
      const div = document.createElement("div");
      div.className = "empty"; div.id = "emptyState";
      div.innerHTML = `<h1>Nothing open yet</h1><p>Drop a PDF in the sidebar to start again.</p>`;
      threadInner.appendChild(div);
    }catch(e){ addError("Couldn't clear documents right now."); }
  });

  // ---------- mobile rail toggle ----------
  const rail = $("#rail"), railToggle = $("#railToggle");
  function checkMobile(){ railToggle.style.display = window.innerWidth <= 720 ? "block" : "none"; }
  window.addEventListener("resize", checkMobile); checkMobile();
  railToggle.addEventListener("click", () => rail.classList.toggle("open"));
})();
</script>
</body>
</html>
