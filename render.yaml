# Render blueprint. Commit this, then in Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: docsight-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free         # 2 GB RAM. "starter" (512 MB) is tight; "free" will OOM.
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false         # set in the Render dashboard, never in git
      - key: QDRANT_URL
        sync: false         # https://xxx.cloud.qdrant.io:6333 — free 1 GB tier
      - key: QDRANT_API_KEY
        sync: false
      - key: APP_NAME
        value: DocSight AI
      - key: DOMAIN_HINT
        value: ""           # leave empty = general purpose; e.g. "legal contracts"
      - key: ENABLE_SHARED_CORPUS
        value: "false"
      - key: COLLECTION_NAME
        value: documents
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: ALLOWED_ORIGINS
        value: "*"          # tighten to your own domain once you have one
      - key: SESSION_TTL_HOURS
        value: "24"
