version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns

  chainlit:
    build: .
    command: chainlit run ui/chainlit_app.py --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - api

  dashboard:
    build: .
    command: streamlit run dashboard/streamlit_ops.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api

# Everything here runs on the free tier of nothing — it's all local
# containers. No paid service is required to run this stack.
